<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inseed - Local Jira Clone</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Inseed Board</h1>
        </header>

        <main>
            <div v-if="loading" class="loading">Loading board...</div>
            <div v-else class="board">
                <div v-for="status in statuses" :key="status" class="column">
                    <h2>[[ status ]]</h2>
                    <div class="issue-list">
                        <div v-for="issue in issuesByStatus(status)" :key="issue.id" class="issue-card" @click="selectIssue(issue)">
                            <h3>[[ issue.title ]]</h3>
                            <p>[[ issue.description ]]</p>
                            <span class="meta">ID: [[ issue.id ]] | Project ID: [[ issue.project_id ]]</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal for Creating/Editing Issue -->
            <div v-if="showModal" class="modal-overlay">
                <div class="modal-content">
                    <h2>[[ selectedIssue.id ? 'Edit Issue' : 'New Issue' ]]</h2>
                    <form @submit.prevent="saveIssue">
                        <label>Title:</label>
                        <input v-model="selectedIssue.title" required>
                        <label>Description:</label>
                        <textarea v-model="selectedIssue.description"></textarea>
                        <label>Status:</label>
                        <select v-model="selectedIssue.status">
                            <option v-for="status in statuses" :key="status" :value="status">[[ status ]]</option>
                        </select>
                        <input type="hidden" v-model="selectedIssue.project_id" value="1">
                        <div class="modal-actions">
                            <button type="submit">Save</button>
                            <button type="button" @click="closeModal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <button class="add-issue-btn" @click="openNewIssueModal">+</button>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
